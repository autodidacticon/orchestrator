# The orchestrator's operator MCP server and session hooks for a Codex session. Append these
# blocks to ~/.codex/config.toml (or a project's .codex/config.toml) and replace <hosts/codex>
# with the absolute path of this directory. See hosts/codex/README.md.
#
# The id uses an underscore: Codex names the tools mcp__orchestrator_operator__<tool>.
# tool_timeout_sec must exceed the operator server's wait cap (90 s, ORCH_WAIT_CAP_MS) by
# at least 30 s, or Codex abandons `wait` and `launch_block` before they return; Codex's
# own default of 60 s is too short.
[mcp_servers.orchestrator_operator]
command = "node"
args = ["<hosts/codex>/bin/orchestrator.mjs", "mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 180

# The session hooks need features.hooks = true. It is on by default in Codex 0.163; set it
# where it is not. If your config already has a [features] table, add the key there instead.
# Codex runs a hook only once it is trusted (recorded under hooks.state in config.toml), or
# under --dangerously-bypass-hook-trust.
[features]
hooks = true

# SessionStart prints one line naming the runs under ORCH_HOME that need attention; Codex adds
# it to the session's context.
[[hooks.SessionStart]]
matcher = "startup|resume|clear"

[[hooks.SessionStart.hooks]]
type = "command"
command = "node \"<hosts/codex>/hooks/session-start.mjs\""
timeout = 10

# SessionEnd posts the hook's process ancestry to every alive daemon, which ends the operator
# server's attachment and releases its claimed launches with keep. Codex's reason is "other".
[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "node \"<hosts/codex>/hooks/session-end.mjs\""
