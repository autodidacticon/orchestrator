# The daemon in namespace orch, its state in a CloudNativePG cluster. See deploy/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orch
labels:
  - pairs:
      app.kubernetes.io/part-of: orchestrator
resources:
  - namespace.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
# The hash suffix rolls the daemon when the file changes: subPath mounts do not see ConfigMap updates.
# The graph is not here: it lives in the store and is loaded with PUT /v1/graph.
configMapGenerator:
  - name: orchestrator-config
    files:
      - orchestrator.yaml
