# One daemon per run: Recreate, and the Postgres run lock refuses a second writer even if two ever overlap.
# No volume claim: the clone and the run directory are on an emptyDir; the state is in Postgres and the
# integration branch on origin, so a new pod starts from a fresh clone. See specs/crash-recovery "Startup on a fresh clone".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Clones REPO_URL into the pod's emptyDir: every pod starts from a fresh clone.
        - name: clone
          image: orchestrator:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: REPO_URL
              value: https://example.invalid/set-REPO_URL.git
          command:
            - sh
            - -ec
            - |
              rm -rf /data/repo
              git clone "$REPO_URL" /data/repo
              # The mounted orchestrator.yaml is not part of the project.
              grep -qxF /orchestrator.yaml /data/repo/.git/info/exclude 2>/dev/null || echo /orchestrator.yaml >> /data/repo/.git/info/exclude
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: orchestrator
          image: orchestrator:dev
          imagePullPolicy: IfNotPresent
          command: ["orchestrator", "--repo", "/data/repo"]
          env:
            # The run directory (worktrees, logs, daemon.json) on the emptyDir; the store is in Postgres.
            - name: ORCH_HOME
              value: /data/home
            # No DATABASE_URL and no PG* variable: the store URL is read from the mounted Secret file named by
            # store.urlFile (orchestrator.yaml), so the daemon's environment (/proc/<pid>/environ) holds no URL or
            # password. See deploy/README.md "Store credentials".
            # One JSON object per stderr line, for the cluster's log collector.
            - name: ORCH_LOG_FORMAT
              value: json
            - name: GIT_AUTHOR_NAME
              value: orchestrator
            - name: GIT_AUTHOR_EMAIL
              value: orchestrator@orch.svc
            - name: GIT_COMMITTER_NAME
              value: orchestrator
            - name: GIT_COMMITTER_EMAIL
              value: orchestrator@orch.svc
          ports:
            - name: api
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/repo/orchestrator.yaml
              subPath: orchestrator.yaml
              readOnly: true
            # The CloudNativePG application Secret's connection URI, as a file; read once at startup and printed only without its password.
            - name: store-url
              mountPath: /var/run/secrets/orchestrator/postgres
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        # Only the `uri` key, readable by the owner and the pod's fsGroup (the daemon's group).
        - name: store-url
          secret:
            secretName: postgres-app
            defaultMode: 0440
            items:
              - key: uri
                path: uri
        - name: config
          configMap:
            name: orchestrator-config
