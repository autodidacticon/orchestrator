# One daemon per run: Recreate, and the Postgres run lock refuses a second writer even if two ever overlap.
# No volume claim: the clone and the run directory are on an emptyDir; the state is in Postgres and the
# integration branch on origin, so a new pod starts from a fresh clone. See specs/crash-recovery "Startup on a fresh clone".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Clones REPO_URL into the pod's emptyDir: every pod starts from a fresh clone.
        - name: clone
          image: orchestrator:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: REPO_URL
              value: https://example.invalid/set-REPO_URL.git
          command:
            - sh
            - -ec
            - |
              rm -rf /data/repo
              git clone "$REPO_URL" /data/repo
              # The mounted orchestrator.yaml is not part of the project.
              grep -qxF /orchestrator.yaml /data/repo/.git/info/exclude 2>/dev/null || echo /orchestrator.yaml >> /data/repo/.git/info/exclude
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: orchestrator
          image: orchestrator:dev
          imagePullPolicy: IfNotPresent
          command: ["orchestrator", "--repo", "/data/repo"]
          env:
            # The run directory (worktrees, logs, daemon.json) on the emptyDir; the store is in Postgres.
            - name: ORCH_HOME
              value: /data/home
            # The CloudNativePG application Secret's connection URI. Printed only without its password.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            # One JSON object per stderr line, for the cluster's log collector.
            - name: ORCH_LOG_FORMAT
              value: json
            - name: GIT_AUTHOR_NAME
              value: orchestrator
            - name: GIT_AUTHOR_EMAIL
              value: orchestrator@orch.svc
            - name: GIT_COMMITTER_NAME
              value: orchestrator
            - name: GIT_COMMITTER_EMAIL
              value: orchestrator@orch.svc
          ports:
            - name: api
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/repo/orchestrator.yaml
              subPath: orchestrator.yaml
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: orchestrator-config
