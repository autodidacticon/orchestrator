# The base plus an in-cluster git origin seeded from ./fixture, a remote run with remote verification
# (orchestrator.yaml here), worker pods running the scripted agent, and one verifier pod. See deploy/README.md.
# graph.yaml and graph-m5.yaml here are not mounted: deploy/smoke.sh sends them with PUT /v1/graph.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orch
labels:
  - pairs:
      app.kubernetes.io/part-of: orchestrator
resources:
  - ../../base
  - git-origin.yaml
configMapGenerator:
  # One key per fixture file; kustomize has no globs here, so a new fixture file is listed too.
  - name: git-origin-fixture
    files:
      - fixture/.gitattributes
      - fixture/README.md
      - fixture/package.json
      - fixture/test.js
  # Replaces the base's orchestrator.yaml with this overlay's (runner.access: remote, git.workerOriginUrl,
  # verifier.mode: remote).
  - name: orchestrator-config
    behavior: replace
    files:
      - orchestrator.yaml
patches:
  - target:
      kind: Deployment
      name: orchestrator
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0
        value:
          name: REPO_URL
          value: git://git-origin.orch.svc:9418/fixture.git
  # The workers run the scripted agent, so the smoke needs no model. replicas stays 0: deploy/smoke.sh scales the
  # Deployment to 2 after its drills, so that until then nothing claims the parked launches.
  - target:
      kind: Deployment
      name: orchestrator-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ORCH_WORKER_AGENT
          value: scripted
  # One verifier pod checks every submission (verifier.mode: remote in orchestrator.yaml): the daemon offers one verify
  # job at a time, so a second replica would only idle. An idle verifier asks for a job at least every 2 s.
  - target:
      kind: Deployment
      name: orchestrator-verifier
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ORCH_VERIFIER_BACKOFF_MAX_MS
          value: "2000"
