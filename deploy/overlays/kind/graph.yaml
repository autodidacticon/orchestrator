# The kind overlay's graph: one ready task, so a pull-mode daemon parks a claimable launch for deploy/smoke.sh to see.
# deploy/smoke.sh sends it with PUT /v1/graph; the daemon keeps it in the store.
nodes:
  - id: SMOKE
    title: Smoke task
    deps: []
    description: Append a line to README.md in the fixture repository.
    acceptanceCriteria:
      - README.md has one more line than before.
