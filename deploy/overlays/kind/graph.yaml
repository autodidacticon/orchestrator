# The kind overlay's graph: one ready task, so a pull-mode daemon parks a claimable launch for it. deploy/smoke.sh
# works SMOKE itself (claims it, commits in the pod's worktree, submits) until it is published; SMOKE-PARKED, which
# depends on it, is then parked and stays claimable across the restart drill. deploy/smoke.sh sends the graph with PUT /v1/graph; the daemon keeps it in the store.
nodes:
  - id: SMOKE
    title: Smoke task
    deps: []
    description: Append a line to README.md in the fixture repository.
    acceptanceCriteria:
      - README.md has one more line than before.
  - id: SMOKE-PARKED
    title: Parked smoke task
    deps: [SMOKE]
    description: Never claimed by deploy/smoke.sh; its launch stays parked across the restart drill.
    acceptanceCriteria:
      - The launch is still claimable after the daemon restarts.
